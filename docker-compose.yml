services:
  mongodb:
    image: mongo:8.2
    container_name: mongodb_sanatorio
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

    volumes:
      - mongodb_sanatorio_data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username '${MONGO_ROOT_USERNAME}' --password '${MONGO_ROOT_PASSWORD}' --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongodb_sanatorio_data:
